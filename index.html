<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEXUS · BIOMETRIC SCANNER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap');
:root{--bg:#000812;--c1:#00ffee;--c2:#ff0099;--c3:#00ff41;--c4:#ffb800;--c5:#4466ff;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Share Tech Mono',monospace;color:var(--c1);}
#bgc{position:fixed;inset:0;z-index:0;}
.scanlines{position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,238,.012) 3px,rgba(0,255,238,.012) 4px);}
.vignette{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse 85% 85% at center,transparent 30%,rgba(0,8,18,.9) 100%);}
#loadbar{position:fixed;top:50px;left:0;height:2px;background:linear-gradient(90deg,var(--c5),var(--c1),var(--c2));box-shadow:0 0 8px var(--c1);transition:width .4s;z-index:200;width:0%;}
#lockfl{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;}
.lktxt{font-family:'Orbitron',sans-serif;font-size:.85rem;font-weight:900;letter-spacing:.28em;color:var(--c3);text-shadow:0 0 20px var(--c3),0 0 40px var(--c3);border:1px solid var(--c3);padding:8px 22px;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);box-shadow:0 0 20px rgba(0,255,65,.3);}
/* APP */
#app{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;}
/* TOP */
#top{width:100%;height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:linear-gradient(180deg,rgba(0,8,18,.98),rgba(0,8,18,.6));border-bottom:1px solid rgba(0,255,238,.07);position:relative;overflow:hidden;}
#top::after{content:'';position:absolute;bottom:-1px;left:0;width:55%;height:1px;background:linear-gradient(90deg,var(--c2),var(--c1),transparent);box-shadow:0 0 8px var(--c1);animation:swp 5s ease-in-out infinite;}
@keyframes swp{0%{transform:translateX(-110%);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(210%);opacity:0}}
.logo{font-family:'Orbitron',sans-serif;font-size:.68rem;font-weight:900;letter-spacing:.22em;color:var(--c1);text-shadow:0 0 16px var(--c1);display:flex;align-items:center;gap:8px;}
.lhex{width:14px;height:14px;flex-shrink:0;background:var(--c2);box-shadow:0 0 12px var(--c2);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);animation:hxr 4s linear infinite;}
@keyframes hxr{to{transform:rotate(360deg)}}
.top-mid{text-align:center;}
.top-clk{font-size:.7rem;letter-spacing:.12em;color:var(--c1);}
.top-sub{font-size:.42rem;letter-spacing:.14em;color:rgba(0,255,238,.22);margin-top:1px;}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.syst{font-size:.55rem;letter-spacing:.12em;color:var(--c3);display:flex;align-items:center;gap:5px;}
.pdot{width:5px;height:5px;border-radius:50%;background:var(--c3);box-shadow:0 0 8px var(--c3);animation:pd 1.3s ease-in-out infinite;}
@keyframes pd{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.15;transform:scale(.4)}}
/* VIEWPORT */
#vpa{flex:1;display:flex;align-items:center;justify-content:center;position:relative;width:100%;overflow:hidden;}
.orb{position:absolute;inset:0;margin:auto;border-radius:50%;pointer-events:none;z-index:5;border:1px solid transparent;}
.o1{width:min(92vw,430px);aspect-ratio:1;border-color:rgba(0,255,238,.05);animation:or1 22s linear infinite;}
.o2{width:min(82vw,385px);aspect-ratio:1;border-top-color:rgba(255,0,153,.38);border-right-color:rgba(255,0,153,.1);animation:or2 9s linear infinite;}
.o3{width:min(72vw,340px);aspect-ratio:1;border-bottom-color:rgba(0,255,238,.5);border-left-color:rgba(0,255,238,.12);animation:or1 14s linear infinite reverse;}
.o4{width:min(62vw,295px);aspect-ratio:1;border-top-color:rgba(68,102,255,.32);animation:or2 6s linear infinite reverse;}
.o2::before,.o2::after{content:'';position:absolute;width:5px;height:5px;background:var(--c2);box-shadow:0 0 8px var(--c2);border-radius:50%;}
.o2::before{top:-2px;left:50%;transform:translateX(-50%);}
.o2::after{bottom:-2px;left:50%;transform:translateX(-50%);}
@keyframes or1{to{transform:rotate(360deg)}}
@keyframes or2{to{transform:rotate(-360deg)}}
/* CAMERA WRAP */
#camw{position:relative;width:min(82vw,380px);aspect-ratio:3/4;z-index:10;}
#cami{position:absolute;inset:0;overflow:hidden;border:1px solid rgba(0,255,238,.12);}
#cami::before{content:'';position:absolute;inset:-1px;z-index:35;pointer-events:none;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(135deg,var(--c2),var(--c1),var(--c5),var(--c2)) border-box;border:1.5px solid transparent;animation:bsh 3s linear infinite;}
@keyframes bsh{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(25deg)}}
.cbr{position:absolute;width:16px;height:16px;z-index:40;pointer-events:none;}
.cbr.tl{top:0;left:0;border-top:2px solid var(--c1);border-left:2px solid var(--c1);box-shadow:-2px -2px 10px rgba(0,255,238,.5);}
.cbr.tr{top:0;right:0;border-top:2px solid var(--c2);border-right:2px solid var(--c2);box-shadow:2px -2px 10px rgba(255,0,153,.5);}
.cbr.bl{bottom:0;left:0;border-bottom:2px solid var(--c2);border-left:2px solid var(--c2);box-shadow:-2px 2px 10px rgba(255,0,153,.5);}
.cbr.br{bottom:0;right:0;border-bottom:2px solid var(--c1);border-right:2px solid var(--c1);box-shadow:2px 2px 10px rgba(0,255,238,.5);}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.8;filter:saturate(.4) contrast(1.2) brightness(.95);}
#tc{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);z-index:20;}
#swp{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--c2) 20%,var(--c1) 50%,var(--c2) 80%,transparent);box-shadow:0 0 18px var(--c1),0 -6px 22px rgba(0,255,238,.25),0 6px 22px rgba(0,255,238,.25);animation:swpd 2.8s cubic-bezier(.4,0,.6,1) infinite;opacity:0;z-index:25;transition:opacity .5s;}
@keyframes swpd{0%{top:-3px}100%{top:100%}}
/* Side panels on cam */
.cpanel{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;z-index:30;pointer-events:none;}
.cpanel.sl{right:calc(100% + 5px);align-items:flex-end;}
.cpanel.sr{left:calc(100% + 5px);align-items:flex-start;}
.cbox{border:1px solid rgba(0,255,238,.12);padding:4px 6px;width:58px;background:rgba(0,6,14,.85);}
.cbl{font-size:.42rem;letter-spacing:.1em;color:rgba(0,255,238,.3);font-family:'Rajdhani',sans-serif;font-weight:700;margin-bottom:1px;}
.cbv{font-size:.65rem;letter-spacing:.04em;}
.cbbar{height:2px;background:rgba(0,255,238,.07);margin-top:3px;border-radius:1px;overflow:hidden;}
.cbbar-f{height:100%;border-radius:1px;transition:width .2s;}
/* OVERLAY */
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;background:rgba(0,8,18,.82);backdrop-filter:blur(8px);transition:opacity .7s;}
.ovt{font-family:'Orbitron',sans-serif;font-weight:900;text-align:center;letter-spacing:.12em;}
.ovt .l1{display:block;font-size:clamp(1.1rem,6vw,1.7rem);color:var(--c1);text-shadow:0 0 30px var(--c1),0 0 60px rgba(0,255,238,.15);}
.ovt .l2{display:block;font-size:clamp(.7rem,3.5vw,1rem);color:var(--c2);text-shadow:0 0 25px var(--c2);letter-spacing:.28em;margin-top:4px;}
.ov-sub{font-family:'Rajdhani',sans-serif;font-size:.62rem;font-weight:500;letter-spacing:.22em;color:rgba(0,255,238,.3);}
.sgfx{position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center;}
.sgfx::before{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid rgba(0,255,238,.1);}
.sgfx::after{content:'';position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(255,0,153,.1);}
.sgr{position:absolute;border-radius:50%;border:1px solid transparent;}
.sgr.r1{inset:-4px;border-top-color:var(--c1);animation:sgsp 1.8s linear infinite;box-shadow:0 0 10px rgba(0,255,238,.5);}
.sgr.r2{inset:8px;border-bottom-color:var(--c2);border-right-color:rgba(255,0,153,.3);animation:sgsp 1.2s linear infinite reverse;}
.sgr.r3{inset:20px;border-left-color:rgba(0,255,65,.4);animation:sgsp 2.6s linear infinite;}
@keyframes sgsp{to{transform:rotate(360deg)}}
.sgc{font-family:'Orbitron',sans-serif;font-size:.42rem;color:var(--c1);text-align:center;letter-spacing:.05em;line-height:1.5;z-index:1;}
#ibtn{padding:11px 30px;background:transparent;border:none;font-family:'Orbitron',sans-serif;font-size:.62rem;letter-spacing:.22em;font-weight:700;cursor:pointer;color:#000812;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);background:linear-gradient(135deg,var(--c1),var(--c5));box-shadow:0 0 24px rgba(0,255,238,.5),0 0 48px rgba(0,255,238,.15);transition:all .25s;}
#ibtn:hover,#ibtn:active{box-shadow:0 0 40px rgba(0,255,238,.8),0 0 80px rgba(0,255,238,.3);transform:scale(1.04);}
/* BOTTOM */
#bot{width:100%;flex-shrink:0;background:linear-gradient(0deg,rgba(0,8,18,.98),rgba(0,8,18,.7));border-top:1px solid rgba(0,255,238,.07);padding:5px 10px 7px;display:flex;flex-direction:column;gap:5px;z-index:10;}
#fbars{display:flex;justify-content:center;gap:8px;align-items:flex-end;}
.fcol{display:flex;flex-direction:column;align-items:center;gap:2px;}
.ftrk{width:16px;height:38px;background:rgba(0,255,238,.03);border:1px solid rgba(0,255,238,.1);border-radius:1px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;position:relative;}
.ftrk::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 7px,rgba(0,255,238,.04) 7px,rgba(0,255,238,.04) 8px);}
.ff{width:100%;transition:height .1s ease;border-radius:1px;position:relative;z-index:1;}
.fl{font-size:.4rem;letter-spacing:.06em;color:rgba(0,255,238,.3);font-family:'Rajdhani',sans-serif;font-weight:700;}
#wvc{width:100%;height:22px;display:block;}
#mrow{display:flex;justify-content:space-around;align-items:center;}
.mt{display:flex;flex-direction:column;align-items:center;gap:1px;}
.mtl{font-size:.42rem;letter-spacing:.1em;color:rgba(0,255,238,.25);font-family:'Rajdhani',sans-serif;font-weight:700;}
.mtv{font-size:.68rem;letter-spacing:.04em;}
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>
<div id="loadbar"></div>
<div id="lockfl"><div class="lktxt">⬡ NEURAL LOCK ACQUIRED</div></div>
<div id="app">
  <div id="top">
    <div class="logo"><div class="lhex"></div>NEXUS·BIO</div>
    <div class="top-mid"><div class="top-clk" id="clk">00:00:00</div><div class="top-sub">SYS:2089 · NHI-X7 · BIOMETRIC</div></div>
    <div class="top-right"><div class="syst"><div class="pdot"></div><span id="stxt">STANDBY</span></div><div style="font-size:.4rem;color:rgba(0,255,238,.18);letter-spacing:.1em">NEURAL·SCAN·v7.2</div></div>
  </div>
  <div id="vpa">
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>
    <div id="camw">
      <div id="cami">
        <div class="cbr tl"></div><div class="cbr tr"></div><div class="cbr bl"></div><div class="cbr br"></div>
        <video id="vid" autoplay muted playsinline></video>
        <canvas id="tc"></canvas>
        <div id="swp"></div>
        <div class="cpanel sl">
          <div class="cbox"><div class="cbl">HANDS</div><div class="cbv" id="cs-h" style="color:var(--c1);text-shadow:0 0 8px var(--c1)">—</div></div>
          <div class="cbox"><div class="cbl">NODES</div><div class="cbv" id="cs-n" style="color:var(--c3);text-shadow:0 0 8px var(--c3)">—</div></div>
          <div class="cbox"><div class="cbl">SPREAD</div><div class="cbv" id="cs-s" style="color:var(--c4);text-shadow:0 0 8px var(--c4)">—</div><div class="cbbar"><div class="cbbar-f" id="cs-sb" style="width:0%;background:var(--c4);box-shadow:0 0 4px var(--c4)"></div></div></div>
        </div>
        <div class="cpanel sr">
          <div class="cbox"><div class="cbl">FPS</div><div class="cbv" id="cs-fps" style="color:var(--c2);text-shadow:0 0 8px var(--c2)">—</div></div>
          <div class="cbox"><div class="cbl">LATENCY</div><div class="cbv" id="cs-lat" style="color:var(--c5);text-shadow:0 0 8px var(--c5)">—</div></div>
          <div class="cbox"><div class="cbl">CONF</div><div class="cbv" id="cs-c" style="color:var(--c1);text-shadow:0 0 8px var(--c1)">—</div><div class="cbbar"><div class="cbbar-f" id="cs-cb" style="width:0%;background:var(--c1);box-shadow:0 0 4px var(--c1)"></div></div></div>
        </div>
        <div id="ov">
          <div class="ovt"><span class="l1">NEXUS</span><span class="l2">BIOMETRIC</span></div>
          <div class="ov-sub">NEURAL HAND INTERFACE · v7.2</div>
          <div class="sgfx"><div class="sgr r1"></div><div class="sgr r2"></div><div class="sgr r3"></div><div class="sgc">HAND<br>SCAN</div></div>
          <button id="ibtn" onclick="boot()">⬡ INITIALIZE</button>
        </div>
      </div>
    </div>
  </div>
  <div id="bot">
    <div id="fbars">
      <div class="fcol"><div class="ftrk"><div class="ff" id="fb0" style="height:0%;background:linear-gradient(0deg,#ff0099,#ff5500);box-shadow:0 0 6px #ff0099"></div></div><div class="fl">THB</div></div>
      <div class="fcol"><div class="ftrk"><div class="ff" id="fb1" style="height:0%;background:linear-gradient(0deg,#00ffee,#0055ff);box-shadow:0 0 6px #00ffee"></div></div><div class="fl">IDX</div></div>
      <div class="fcol"><div class="ftrk"><div class="ff" id="fb2" style="height:0%;background:linear-gradient(0deg,#00ff41,#00cccc);box-shadow:0 0 6px #00ff41"></div></div><div class="fl">MID</div></div>
      <div class="fcol"><div class="ftrk"><div class="ff" id="fb3" style="height:0%;background:linear-gradient(0deg,#ffb800,#ff4400);box-shadow:0 0 6px #ffb800"></div></div><div class="fl">RNG</div></div>
      <div class="fcol"><div class="ftrk"><div class="ff" id="fb4" style="height:0%;background:linear-gradient(0deg,#aa44ff,#4466ff);box-shadow:0 0 6px #aa44ff"></div></div><div class="fl">PNK</div></div>
    </div>
    <canvas id="wvc"></canvas>
    <div id="mrow">
      <div class="mt"><div class="mtl">HANDS</div><div class="mtv" id="m-h" style="color:var(--c1);text-shadow:0 0 8px var(--c1)">—</div></div>
      <div class="mt"><div class="mtl">NODES</div><div class="mtv" id="m-n" style="color:var(--c3);text-shadow:0 0 8px var(--c3)">—</div></div>
      <div class="mt"><div class="mtl">FPS</div><div class="mtv" id="m-fps" style="color:var(--c4);text-shadow:0 0 8px var(--c4)">—</div></div>
      <div class="mt"><div class="mtl">LATENCY</div><div class="mtv" id="m-lat" style="color:var(--c2);text-shadow:0 0 8px var(--c2)">—</div></div>
      <div class="mt"><div class="mtl">FRAME</div><div class="mtv" id="m-fr" style="color:var(--c5);text-shadow:0 0 8px var(--c5)">—</div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
// ── BACKGROUND: Matrix hex streams ──
const BGC=document.getElementById('bgc'),BGX=BGC.getContext('2d');
const CHARS='0123456789ABCDEF⬡◈⬢∇△○';
let COLS=[],bgW,bgH;
function initBG(){bgW=BGC.width=window.innerWidth;bgH=BGC.height=window.innerHeight;COLS=[];for(let i=0;i<Math.floor(bgW/18);i++)COLS.push({x:i*18+9,y:Math.random()*-bgH,spd:.4+Math.random()*1.4,len:6+Math.floor(Math.random()*14),hot:Math.random()>.88});}
function renderBG(){BGX.fillStyle='rgba(0,8,18,.05)';BGX.fillRect(0,0,bgW,bgH);COLS.forEach(c=>{c.y+=c.spd;if(c.y>bgH+c.len*16){c.y=-c.len*16;c.spd=.4+Math.random()*1.4;}for(let j=0;j<c.len;j++){const cy=c.y-j*16;if(cy<0||cy>bgH)continue;const a=(1-j/c.len)*(c.hot?.55:.1);BGX.font=`${j===0?'11px':'9px'} Share Tech Mono`;BGX.fillStyle=c.hot?`rgba(255,0,153,${a})`:`rgba(0,255,238,${a})`;BGX.fillText(CHARS[Math.floor(Math.random()*CHARS.length)],c.x,cy);}});requestAnimationFrame(renderBG);}
initBG();window.addEventListener('resize',initBG);renderBG();

// ── WAVEFORM ──
const WVC=document.getElementById('wvc'),WVX=WVC.getContext('2d');
let wvData=[],wvF=0,wvActive=false;
function initWV(){WVC.width=WVC.offsetWidth*devicePixelRatio;WVC.height=WVC.offsetHeight*devicePixelRatio;WVC.style.width=WVC.offsetWidth+'px';WVC.style.height=WVC.offsetHeight+'px';wvData=new Array(WVC.width).fill(0);}
function renderWV(){const W=WVC.width,H=WVC.height;WVX.clearRect(0,0,W,H);wvF++;const v=wvActive?Math.sin(wvF*.22)*.35+Math.sin(wvF*.07)*.45+Math.sin(wvF*.41)*.15+(Math.random()-.5)*.18:(Math.random()-.5)*.04;wvData.push(v);if(wvData.length>W)wvData.shift();WVX.beginPath();wvData.forEach((d,i)=>{i===0?WVX.moveTo(i,H/2-d*H*.4):WVX.lineTo(i,H/2-d*H*.4);});const g=WVX.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(0,255,238,0)');g.addColorStop(.25,'rgba(0,255,238,.7)');g.addColorStop(.6,'rgba(255,0,153,.7)');g.addColorStop(1,'rgba(68,102,255,0)');WVX.strokeStyle=g;WVX.lineWidth=1.5;WVX.shadowColor='#00ffee';WVX.shadowBlur=8;WVX.stroke();WVX.beginPath();WVX.moveTo(0,H/2);WVX.lineTo(W,H/2);WVX.strokeStyle='rgba(0,255,238,.06)';WVX.lineWidth=.5;WVX.shadowBlur=0;WVX.stroke();requestAnimationFrame(renderWV);}

// ── CLOCK ──
function tick(){const n=new Date();document.getElementById('clk').textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;}
setInterval(tick,1000);tick();

// ── TRACKING ENGINE ──
const vid=document.getElementById('vid'),tc=document.getElementById('tc'),ctx=tc.getContext('2d');
const FC=['#ff0099','#00ffee','#00ff41','#ffb800','#aa44ff'];
const CONNS=[[[0,1],[1,2],[2,3],[3,4]],[[0,5],[5,6],[6,7],[7,8]],[[0,9],[9,10],[10,11],[11,12]],[[0,13],[13,14],[14,15],[15,16]],[[0,17],[17,18],[18,19],[19,20]]];
const PALM=[[5,9],[9,13],[13,17]];
const TIPS=[4,8,12,16,20],TLBLS=['THB','IDX','MID','RNG','PNK'];
let frame=0,dashOff=0,fps=0,lastT=Date.now(),fBuf=[],hadHands=false,scanBurst=0;
const particles=[];

class Pt{constructor(x,y,c){this.x=x;this.y=y;this.c=c;this.vx=(Math.random()-.5)*3.5;this.vy=(Math.random()-.5)*3.5-1;this.l=1;this.d=.025+Math.random()*.04;this.r=.8+Math.random()*2.5;}
update(){this.x+=this.vx;this.y+=this.vy;this.l-=this.d;this.vy*=.94;this.vx*=.98;}
draw(){if(this.l<=0)return;ctx.save();ctx.globalAlpha=this.l*.75;ctx.shadowColor=this.c;ctx.shadowBlur=12;ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.r*this.l,0,Math.PI*2);ctx.fill();ctx.restore();}}

function lx(lm){return{x:lm.x*tc.width,y:lm.y*tc.height};}

function hexNode(x,y,r,col){
  ctx.save();
  const gr=ctx.createRadialGradient(x,y,0,x,y,r*3.5);gr.addColorStop(0,col+'44');gr.addColorStop(1,'transparent');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r*3.5,0,Math.PI*2);ctx.fill();
  ctx.shadowColor=col;ctx.shadowBlur=20;ctx.strokeStyle=col;ctx.lineWidth=1.4;ctx.fillStyle=col+'18';
  ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6,hx=x+r*Math.cos(a),hy=y+r*Math.sin(a);i===0?ctx.moveTo(hx,hy):ctx.lineTo(hx,hy);}ctx.closePath();ctx.fill();ctx.stroke();
  ctx.shadowBlur=30;ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();ctx.arc(x,y,r*.35,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function plasmaLine(x1,y1,x2,y2,col,off=0){
  ctx.save();
  ctx.shadowColor=col;ctx.shadowBlur=6;ctx.strokeStyle=col+'33';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.shadowBlur=18;ctx.setLineDash([7,5]);ctx.lineDashOffset=-(dashOff+off);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.setLineDash([3,12]);ctx.lineDashOffset=dashOff*1.5+off;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
}

function tipPulse(x,y,col,fi){
  for(let r=0;r<3;r++){const p=(Math.sin(frame*.09+fi*.6+r*.9)+1)/2;ctx.save();ctx.globalAlpha=p*(.55-r*.15);ctx.strokeStyle=col;ctx.lineWidth=1;ctx.shadowColor=col;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(x,y,9+r*8+p*6,0,Math.PI*2);ctx.stroke();ctx.restore();}
}

function wristOrb(x,y){
  ctx.save();for(let i=0;i<10;i++){const a=i/10*Math.PI*2+frame*.05,rx=Math.cos(a)*12,ry=Math.sin(a)*5;ctx.globalAlpha=.5;ctx.fillStyle=i%2===0?'#00ffee':'#ff0099';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(x+rx,y+ry,1.5,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=.3;ctx.strokeStyle='#00ffee';ctx.lineWidth=1;ctx.shadowColor='#00ffee';ctx.shadowBlur=10;ctx.setLineDash([3,6]);ctx.lineDashOffset=-frame*.08;ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();
}

function drawBurst(wx,wy){
  if(scanBurst<=0)return;const prog=1-scanBurst/35;ctx.save();ctx.globalAlpha=(1-prog)*.8;ctx.strokeStyle='#00ff41';ctx.lineWidth=2;ctx.shadowColor='#00ff41';ctx.shadowBlur=24;ctx.beginPath();ctx.arc(wx,wy,prog*140,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=(1-prog)*.3;ctx.beginPath();ctx.arc(wx,wy,prog*200,0,Math.PI*2);ctx.stroke();ctx.restore();scanBurst--;
}

function callout(x,y,col,lbl,right){
  const ox=right?x+22:x-22,oy=y-20,ex=right?ox+24:ox-24;
  ctx.save();ctx.globalAlpha=.65;ctx.strokeStyle=col;ctx.lineWidth=.7;ctx.setLineDash([2,4]);ctx.shadowColor=col;ctx.shadowBlur=5;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ox,oy);ctx.lineTo(ex,oy);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=col;ctx.font='bold 7.5px Share Tech Mono';ctx.textAlign=right?'left':'right';ctx.shadowBlur=10;ctx.fillText(lbl,right?ex+2:ex-2,oy+3);ctx.restore();
}

function neuralWeb(lms){
  ctx.save();ctx.lineWidth=.3;ctx.setLineDash([1,10]);
  for(let i=0;i<lms.length;i++)for(let j=i+2;j<lms.length;j++){const a=lx(lms[i]),b=lx(lms[j]),d=Math.hypot(a.x-b.x,a.y-b.y);if(d<65){ctx.globalAlpha=(1-d/65)*.07;ctx.strokeStyle='#00ffee';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
  ctx.setLineDash([]);ctx.restore();
}

function getExt(lms,ti,mi,bi){const t=lx(lms[ti]),m=lx(lms[mi]),b=lx(lms[bi]);return Math.min(1,Math.hypot(t.x-b.x,t.y-b.y)/(Math.hypot(m.x-b.x,m.y-b.y)*2.3));}

function drawHand(lms){
  neuralWeb(lms);
  CONNS.forEach((pairs,fi)=>pairs.forEach(([a,b],pi)=>{const p1=lx(lms[a]),p2=lx(lms[b]);plasmaLine(p1.x,p1.y,p2.x,p2.y,FC[fi],fi*22+pi*6);}));
  PALM.forEach(([a,b])=>{const p1=lx(lms[a]),p2=lx(lms[b]);plasmaLine(p1.x,p1.y,p2.x,p2.y,'rgba(100,180,255,.6)',90);});
  lms.forEach((lm,i)=>{
    const{x,y}=lx(lm),isTip=TIPS.includes(i);
    let c='rgba(0,255,238,.7)';if(i>=1&&i<=4)c=FC[0];else if(i>=5&&i<=8)c=FC[1];else if(i>=9&&i<=12)c=FC[2];else if(i>=13&&i<=16)c=FC[3];else if(i>=17&&i<=20)c=FC[4];
    hexNode(x,y,isTip?7:i===0?9:4,c);
    if(isTip){tipPulse(x,y,c,i);if(Math.random()>.45)particles.push(new Pt(x,y,c));}
  });
  TIPS.forEach((ti,i)=>{const{x,y}=lx(lms[ti]);callout(x,y,FC[i],TLBLS[i],i>2);});
  const w=lx(lms[0]);wristOrb(w.x,w.y);drawBurst(w.x,w.y);
  const exts=[getExt(lms,4,3,1),getExt(lms,8,7,5),getExt(lms,12,11,9),getExt(lms,16,15,13),getExt(lms,20,19,17)];
  exts.forEach((e,i)=>{const el=document.getElementById('fb'+i);if(el)el.style.height=(e*100)+'%';});
  const t1=lx(lms[8]),t5=lx(lms[20]);const sp=Math.min(100,Math.hypot(t1.x-t5.x,t1.y-t5.y)/tc.width*200);
  document.getElementById('cs-s').textContent=Math.round(sp)+'%';document.getElementById('cs-sb').style.width=sp+'%';
}

function lockFlash(){const el=document.getElementById('lockfl');el.style.transition='opacity 0s';el.style.opacity='1';setTimeout(()=>{el.style.transition='opacity .9s';el.style.opacity='0';},500);scanBurst=35;}

function onResults(res){
  tc.width=vid.videoWidth||480;tc.height=vid.videoHeight||640;ctx.clearRect(0,0,tc.width,tc.height);frame++;dashOff+=.8;
  const now=Date.now(),dt=now-lastT;lastT=now;fBuf.push(1000/dt);if(fBuf.length>20)fBuf.shift();fps=Math.round(fBuf.reduce((a,b)=>a+b,0)/fBuf.length);
  const n=res.multiHandLandmarks?.length||0;
  if(n>0&&!hadHands){lockFlash();hadHands=true;}if(n===0)hadHands=false;
  wvActive=n>0;
  ['m-h','cs-h'].forEach(id=>document.getElementById(id).textContent=n);
  ['m-n','cs-n'].forEach(id=>document.getElementById(id).textContent=n*21||0);
  document.getElementById('m-fps').textContent=fps;document.getElementById('cs-fps').textContent=fps;
  document.getElementById('m-lat').textContent=dt+'ms';document.getElementById('cs-lat').textContent=dt+'ms';
  document.getElementById('m-fr').textContent=frame;document.getElementById('cs-c').textContent=n?'HIGH':'LOW';
  document.getElementById('cs-cb').style.width=n?'88%':'12%';document.getElementById('stxt').textContent=n?'TRACKING':'SCANNING';
  for(let i=particles.length-1;i>=0;i--){particles[i].update();particles[i].draw();if(particles[i].l<=0)particles.splice(i,1);}
  if(n>0)res.multiHandLandmarks.forEach(lms=>drawHand(lms));
  else{for(let i=0;i<5;i++){const e=document.getElementById('fb'+i);if(e)e.style.height='0%';}}
}

async function boot(){
  const ov=document.getElementById('ov');ov.style.opacity='0';ov.style.pointerEvents='none';
  document.getElementById('stxt').textContent='LINKING FEED';document.getElementById('loadbar').style.width='15%';
  document.getElementById('swp').style.opacity='1';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:480},height:{ideal:640}},audio:false});
    vid.srcObject=stream;await new Promise(r=>vid.onloadedmetadata=r);
    document.getElementById('stxt').textContent='LOADING NEURAL NET';document.getElementById('loadbar').style.width='50%';
    const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.55});
    hands.onResults(onResults);document.getElementById('loadbar').style.width='82%';
    const cam=new Camera(vid,{onFrame:async()=>await hands.send({image:vid}),width:480,height:640});cam.start();
    document.getElementById('loadbar').style.width='100%';document.getElementById('stxt').textContent='SCANNING';ov.style.display='none';
    setTimeout(()=>document.getElementById('loadbar').style.opacity='0',1200);
  }catch(e){
    document.getElementById('stxt').textContent='DENIED';
    const ov2=document.getElementById('ov');ov2.style.opacity='1';ov2.style.pointerEvents='all';
    ov2.innerHTML='<div style="font-family:Orbitron,sans-serif;font-size:clamp(.9rem,5vw,1.4rem);font-weight:900;color:#ff0099;text-shadow:0 0 25px #ff0099;text-align:center;letter-spacing:.1em">ACCESS<br>DENIED</div><div style="font-family:Rajdhani,sans-serif;font-size:.6rem;color:rgba(0,255,238,.35);letter-spacing:.18em;font-weight:600">ALLOW CAMERA & RELOAD</div>';
  }
}
window.addEventListener('load',()=>{initWV();renderWV();});
window.addEventListener('resize',initWV);
</script>
